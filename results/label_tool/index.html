*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.app{display:grid;grid-template-columns:290px 1fr;height:100vh}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-top{padding:12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1}
button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.prog{font-size:12px;color:var(--muted);margin:6px 0 2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.filters label{display:flex;align-items:center;gap:3px}
.list{overflow:auto;flex:1}
.item{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:center}
.item:hover{background:var(--bg)}
.item.cur{background:var(--acc-soft)}
.item .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.item .q{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--good)}
.side-bot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
main{overflow:auto;min-height:0}
.wrap{max-width:1180px;margin:0 auto;padding:18px 22px 140px}
h1{font-size:19px;margin:4px 0 6px;line-height:1.35}
.meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.card h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{font-size:15px;line-height:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{font-size:12px;padding:1px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.up{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.down{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.passage{font-size:13px;color:var(--ink);background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:6px;max-height:260px;overflow:auto}
.ptitle{font-weight:600;font-size:13px}
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
mark.sa{background:var(--hl2)}
.sents{font-size:12px;margin-top:6px}
.sents div{display:flex;gap:6px;margin:2px 0}
.sents b{font-variant-numeric:tabular-nums;min-width:44px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
ul.refs{margin:6px 0 0;padding-left:18px}
ul.refs li{margin:4px 0}
.sa-list{font-size:13px}
.sa-list span{display:inline-block;margin:2px 6px 2px 0}
.labelbar{position:fixed;bottom:0;left:290px;right:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 22px;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.lb{max-width:1180px;margin:0 auto;display:grid;gap:7px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .lab{width:92px;color:var(--muted);font-size:12px}
.opt{font-size:13px}
.opt kbd{font:11px ui-monospace,monospace;opacity:.7;margin-right:4px}
textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;flex:1;min-width:200px;height:32px;resize:vertical}
.hint{font-size:11px;color:var(--muted)}
.big{font-size:16px;font-weight:600}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{height:40vh}.labelbar{left:0}.cols{grid-template-columns:1fr}.wrap{padding:12px 16px 220px}}
</style>

nd is normally described as \"lub\". The second heart sound, S2, is the sound of the semilunar valves closing during ventricular diastole and is described as \"dub\". Each sound consists of two components, reflecting the slight difference in time as the two valves close. S2 may split into two distinct sounds, either as a result of inspiration or different valvular or cardiac problems. Additional heart sounds may also be present and these give rise to gallop rhythms. A third heart sound, S3 usually indicates an increase in ventricular blood volume. A fourth heart", "rouge": 33.33333333333333, "str_em": 0.0, "cit_rec": 50.0, "cit_prec": 50.0, "length": 30, "issup": 0.9779837899727611, "relevance": 0.9941346619813233, "released_score": 1.9721184519540844, "g_mean": 0.023175, "sents": [{"s": "The second sound of the heartbeat, called the \"systolic\" second sound or S2, is the sound of the semilunar valves closing during ventricular diastole. It is normally described as \"dub\".", "p_ent": 0.94189, "p_con": 0.00254}, {"s": "The second sound of the heartbeat, called the \"systolic\" second sound or S2, is the sound of the semilunar valves closing during ventricular diastole.", "p_ent": 0.04601, "p_con": 0.06101}, {"s": "It is normally described as \"dub\".", "p_ent": 0.00034, "p_con": 0.08357}]}, "d2": {"node_id": 4, "p_idx": 3, "text": "Second sound is a quantum mechanical phenomenon in which heat transfer occurs by wave-like motion, rather than by the more usual mechanism of diffusion. This leads to a very high thermal conductivity. It is known as \"second sound\" because the wave motion of heat is similar to the propagation of pressure waves in air (sound).", "passage_title": "Second sound", "passage": "Second sound Second sound is a quantum mechanical phenomenon in which heat transfer occurs by wave-like motion, rather than by the more usual mechanism of diffusion. This leads to a very high thermal conductivity. It is known as \"second sound\" because the wave motion of heat is similar to the propagation of pressure waves in air (sound). Normal sound waves are fluctuations in the density of molecules in a substance; second sound waves are fluctuations in the density of particle-like thermal excitations (rotons and phonons). Second sound can be observed in any system in which most phonon-phonon collisions conserve momentum.", "rouge": 20.0, "str_em": 0.0, "cit_rec": 100.0, "cit_prec": 100.0, "length": 55, "issup": 0.8200431770344935, "relevance": 0.9730365026788664, "released_score": 1.79307967971336, "g_mean": 0.9873033333333333, "sents": [{"s": "Second sound is a quantum mechanical phenomenon in which heat transfer occurs by wave-like motion, rather than by the more usual mechanism of diffusion. This leads to a very high thermal conductivity. It is known as \"second sound\" because the wave motion of heat is similar to the propagation of pressure waves in air (sound).", "p_ent": 0.99861, "p_con": 5e-05}, {"s": "Second sound is a quantum mechanical phenomenon in which heat transfer occurs by wave-like motion, rather than by the more usual mechanism of diffusion.", "p_ent": 0.99649, "p_con": 0.0001}, {"s": "This leads to a very high thermal conductivity.", "p_ent": 0.98598, "p_con": 9e-05}, {"s": "It is known as \"second sound\" because the wave motion of heat is similar to the propagation of pressure waves in air (sound).", "p_ent": 0.97944, "p_con": 0.00028}]}, "d_rouge": -13.333333333333329, "d_strem": 0, "d_cit": 50.0, "rank": 26, "priority": true}, {"id": "R-704", "task": "R", "set": "B", "q_idx": 704, "question": "Who lit the torch at the 2012 olympics?", "short_answers": [{"q": "Who lit the torch at the 2012 Winter Youth Olympics?", "a": ["Egon Zimmermann", "Franz Klammer"]}, {"q": "Who lit the torch at the 2012 Summer Olympics?", "a": ["Desiree Henry", "Jordan Duckitt", "Adelle Tracey", "Katie Kirk", "Aidan Reynolds", "Cameron MacRitchie", "Callum Airlie"]}], "references": ["In the 2012 Winter Youth Olympics, both Egon Zimmermann and Franz Klammer lit the cauldron. And in the 2012 Summer Olympics seven teenagers lit the cauldron, Desiree Henry, Jordan Duckitt, Adelle Tracey, Katie Kirk, Aidan Reynolds, Cameron MacRitchie and Callum Airlie.", "Famous athletes (active or retired) with significant sporting achievements while representing the host country, promising young athletes, or other individuals with symbolic significance, have been selected as the last runners in the Olympic torch relay and consequently have the honor of lighting the Olympic cauldron at the opening ceremony. At the 2012 Summer Olympics in London, even aspiring young athletes—each nominated by a former British Olympic champion—had the honor of lighting the cauldron. Those athletes were Desiree Henry, Jordan Duckitt, Adelle Tracey, Katie Kirk, Aidan Reynolds, Cameron MacRitchie, and Callum Airlie. For the 2012 Winter Youth Olympics, Egon Zimmermann and Franz Klammer lit the torch."], "released": {"node_id": 4, "p_idx": 3, "text": "The Olympic torch was lit at the 2012 Summer Olympics by Steve Redgrave, a British rower and five-time Olympic champion.", "passage_title": "2012 Summer Olympics opening ceremony", "passage": "and the Grimethorpe Colliery Band. The Olympic Oaths were taken by taekwondo athlete Sarah Stevenson on behalf of the athletes, by British AIBA Referee Mik Basi on behalf of the officials, and by Eric Farrell on behalf of the coaches. This section was named after a song by The Smiths. The motorboat driven by David Beckham arrived with the Olympic Flame via the Limehouse Cut and the Lee Navigation. Steve Redgrave lit his torch from that on the boat, and carried it into the stadium through an honour guard of 500 of the construction workers who had built the Olympic", "rouge": 22.580645161290324, "str_em": 0.0, "cit_rec": 0.0, "cit_prec": 0.0, "length": 20, "issup": 0.9551643667569496, "relevance": 0.99341022718768, "released_score": 1.9485745939446297, "g_mean": 0.00075, "sents": [{"s": "The Olympic torch was lit at the 2012 Summer Olympics by Steve Redgrave, a British rower and five-time Olympic champion.", "p_ent": 0.00075, "p_con": 0.00128}, {"s": "The Olympic torch was lit at the 2012 Summer Olympics by Steve Redgrave, a British rower and five-time Olympic champion.", "p_ent": 0.00075, "p_con": 0.00128}]}, "d2": {"node_id": 5, "p_idx": 4, "text": "The torch was lit at Land's End by Sea King helicopter by members of 771 Naval Air Squadron.", "passage_title": "2012 Summer Olympics torch relay", "passage": "along with a group of teenagers: rugby player Dennis Coles from East Ayrshire representing Scotland, hockey player Chloe Brown from Bangor representing Northern Ireland, athlete Sean White from Swansea representing Wales, hockey player Georgia Higgs from Cornwall, and Sakinah Muhammad from Hackney representing London. After an overnight stay at RNAS Culdrose, members of 771 Naval Air Squadron took the Flame to Land's End by Sea King helicopter. There the Olympic Cauldron was lit. Olympic sailing star Ben Ainslie ran the first leg of the relay. In the summer of 2010, the Design Council were commissioned to prepare the design brief", "rouge": 9.523809523809526, "str_em": 0.0, "cit_rec": 100.0, "cit_prec": 100.0, "length": 18, "issup": 0.941183860732636, "relevance": 0.9962637791236586, "released_score": 1.9374476398562948, "g_mean": 0.9959, "sents": [{"s": "The torch was lit at Land's End by Sea King helicopter by members of 771 Naval Air Squadron.", "p_ent": 0.9959, "p_con": 0.00028}, {"s": "The torch was lit at Land's End by Sea King helicopter by members of 771 Naval Air Squadron.", "p_ent": 0.9959, "p_con": 0.00028}]}, "d_rouge": -13.056835637480798, "d_strem": 0, "d_cit": 100.0, "rank": 27, "priority": true}, {"id": "R-89", "task": "R", "set": "A", "q_idx": 89, "question": "When does the champions league group stage start?", "short_answers": [{"q": "When does the 2017-2018 champions league group stage start?", "a": ["12 September 2017"]}, {"q": "When does the 2016-2017 champions league group stage start?", "a": ["13 September 2016"]}, {"q": "When does the 2015-2016 champions league group stage start?", "a": ["15 September 2015"]}, {"q": "When did the 2017-18 UEFA Champions League group stage start?", "a": ["12 September 2017"]}, {"q": "When did the 2016-17 UEFA Champions League group stage start?", "a": ["13 September 2016"]}, {"q": "When did the 2015-16 UEFA Champions League group stage start?", "a": ["15 September 2015"]}], "references": ["The 2015–16 UEFA Champions League was the 61st season of Europe's premier club football tournament organised by UEFA. Group stage matches began on 15 September 2015 for this season. In the following season 2016-17, group stage matches began 13 September 2016 and on 12 September 2017 for the 2017-2018 champions league group stage.", "The UEFA Champions League is an annual club football competition organised by the Union of European Football Associations (UEFA) and contested by top-division European clubs, deciding the competition winners through a round robin group stage to qualify for a double-legged knockout format, and a single leg final. The 2015-16 UEFA Champions League group stage started on 15 September 2015. The 2016-2017 UEFA Champions League group stage started on 13 September 2016. The 2017-2018 UEFA Champions League group stage started on 12 September 2017."], "released": {"node_id": 3, "p_idx": 2, "text": "The 2017–18 UEFA Champions League group stage began on 12 September and ended on 6 December 2017. The 2018–19 UEFA Champions League group stage began on 12 September and ended on 6 December 2018.", "passage_title": "2017–18 UEFA Champions League group stage", "passage": "by UEFA (local times are in parentheses). 2017–18 UEFA Champions League group stage The 2017–18 UEFA Champions League group stage began on 12 September and ended on 6 December 2017. A total of 32 teams competed in the group stage to decide the 16 places in the knockout phase of the 2017–18 UEFA C al government of the United States effectively encouraged the individual states to adopt unemployment insurance plans."], "released": {"node_id": 1, "p_idx": 0, "text": "The Employment and Social Insurance Act was passed in 1935. The Emergency Unemployment Compensation Act was passed in 1991.", "passage_title": "Employment and Social Insurance Act", "passage": "the federal government pursued the traditional model of providing temporary and emergency funding to municipalities in support of their relief aid. Over time a new policy was developed in an effort to combat public unemployment that would be administered by the federal government and provided nationally. R.B. Bennett's government passed the \"Employment and Social Insurance Act\" in 1935, to establish a national unemployment scheme. The national unemployment scheme was modeled on the British approach at the time, which included flat-rate financial benefits for the unemployed based on worker, employer, and state contributions. The Act was part of eight interventionist laws,", "rouge": 23.333333333333336, "str_em": 33.333333333333336, "cit_rec": 50.0, "cit_prec": 50.0, "length": 19, "issup": 0.9856309722714959, "relevance": 0.9990889486487732, "released_score": 1.984719920920269, "g_mean": 0.49805499999999997, "sents": [{"s": "The Employment and Social Insurance Act was passed in 1935. The Emergency Unemployment Compensation Act was passed in 1991.", "p_ent": 2e-05, "p_con": 0.99968}, {"s": "The Employment and Social Insurance Act was passed in 1935.", "p_ent": 0.9961, "p_con": 0.00022}, {"s": "The Emergency Unemployment Compensation Act was passed in 1991.", "p_ent": 1e-05, "p_con": 0.99993}]}, "d2": {"node_id": 4, "p_idx": 3, "text": "The Unemployment Compensation Extension Act of 2009 was passed on September 22, 2009.", "passage_title": "Worker, Homeownership, and Business Assistance Act of 2009", "passage": "Worker, Homeownership, and Business Assistance Act of 2009 The Unemployment Compensation Extension A rom August 9, 1830, until he was overthrown in 1848.", "Charles X (born Charles Philippe, Count of Artois) was King of France from 16 September 1824 until 2 August 1830. His reign of almost six years proved to be deeply unpopular from the moment of his coronation in 1825. France faced urban riots which led to the July Revolution of 1830, which resulted in his abdication and the election of Louis-Philippe I as King of the French. Louis-Philippe was sworn in as King Louis-Philippe I on 9 August 1830. Linking the monarchy to a people instead of a territory was aimed at undercutting the legitimist claims of Charles X and his family."], "released": {"node_id": 2, "p_idx": 1, "text": "Napoleon III was the president of France from 1848 to 1852 and emperor of France from 1852 to 1870.", "passage_title": "Napoleon III", "passage": "Napoleon III Napoleon III (born Charles-Louis Napoléon Bonaparte; 20 April 1808 – 9 January 1873) was the Emperor of the French from 1852 to 1870 and, as Louis-Napoléon Bonaparte, the President of France from 1848 to 1852. He was the only president of the French Second Republic and the founder of the Second French Empire. The nephew and heir of Napoleon I, he was the first head of state of France to hold the title of president, the first elected by a direct popular vote and the youngest until the election of Emmanuel Macron in 2017. Barred by the Constitution", "rouge": 23.076923076923077, "str_em": 0.0, "cit_rec": 100.0, "cit_prec": 100.0, "length": 19, "issup": 0.9736037277438856, "relevance": 0.9992958483555675, "released_score": 1.972899576099453, "g_mean": 0.83372, "sents": [{"s": "Napoleon III was the president of France from 1848 to 1852 and emperor of France from 1852 to 1870.", "p_ent": 0.83372, "p_con": 0.03319}, {"s": "Napoleon III was the president of France from 1848 to 1852 and emperor of France from 1852 to 1870.", "p_ent": 0.83372, "p_con": 0.03319}]}, "d2": {"node_id": 4, "p_idx": 3, "text": "In 1830, King Louis Philippe I was the ar on the ISS.", "passage_title": "ISS year long mission", "passage": "ISS year long mission The One-Year Mission was a scientific research project aboard the International Space Station, which studied the health effects of long-term spaceflight. Scott Kelly and Mikhail Korniyenko spent 342 days in space, with scientists performing medical experiments. Kelly and Kornienko launched on 27 March 2015 on Soyuz TMA-16M along with Gennady Padalka. The mission encompassed Expeditions 43, 44, 45 and 46. The pair safely landed in Kazakhstan on March 2, 2016, returning aboard Soyuz TMA-18M with Sergey Volkov. The mission supported the NASA Twins study, which helps shed light on the health effects of long duration spaceflight,", "rouge": 42.10526315789474, "str_em": 50.0, "cit_rec": 100.0, "cit_prec": 100.0, "length": 16, "issup": 0.985825304024276, "relevance": 0.9993121487722454, "released_score": 1.9851374527965215, "g_mean": 0.00312, "sents": [{"s": "Scott Kelly and Mikhail Korniyenko were the two astronauts who stayed a year on the ISS.", "p_ent": 0.00312, "p_con": 0.00034}, {"s": "Scott Kelly and Mikhail Korniyenko were the two astronauts who stayed a year on the ISS.", "p_ent": 0.00312, "p_con": 0.00034}]}, "d2": {"node_id": 5, "p_idx": 4, "text": "Scott Kelly and Terry Virts were the two astronauts who stayed a year on the ISS.", "passage_title": "A Beautiful Planet", "passage": "were: Scott Kelly (NASA / USA), who spent roughly a year in space during a long, uninterrupted stay aboard the International Space Station, Samantha Cristoforetti (European Space Agency / Italy), who has spent more time in an uninterrupted spaceflight than any other European astronaut, Barry \"Butch\" Wilmore (NASA / USA), commander of the 42nd expedition to the ISS from November 10, 2014 to March 11, 2015, Terry Virts (NASA / USA), commander of the 43rd expedition to the ISS from March 11, 2015 to June 11, 2015, Anton Shkaplerov (Roscosmos / Russia), the commander of the Soyuz spacecraft that ries between systolic and diastolic pressures. Systolic pressure is peak pressure in the arteries, which occurs near the end of the cardiac cycle when the ventricles are contracting."], "released": {"node_id": 1, "p_idx": 0, "text": "Systolic blood pressure is the pressure of blood in the arteries when the heart contracts.", "passage_title": "Blood pressure", "passage": "millimetres of mercury (mmHg), though aneroid and electronic devices do not contain mercury. For each heartbeat, blood pressure varies between systolic and diastolic pressures. Systolic pressure is peak pressure in the arteries, which occurs near the end of the cardiac cycle when the ventricles are contracting. Diastolic pressure is minimum pressure in the arteries, which occurs near the beginning of the cardiac cycle when the ventricles are filled with blood. An example of normal measured values for a resting, healthy adult human is 120 mmHg systolic and 80 mmHg diastolic (written as 120/80 mmHg, and spoken as \"one-twenty over eighty\").", "rouge": 27.27272727272727, "str_em": 0.0, "cit_rec": 100.0, "cit_prec": 100.0, "length": 15, "issup": 0.9990084168044713, "relevance": 0.9995923473939392, "released_score": 1.9986007641984105, "g_mean": 0.01073, "sents": [{"s": "Systolic blood pressure is the pressure of blood in the arteries when the heart contracts.", "p_ent": 0.01073, "p_con": 0.00458}, {"s": "Systolic blood pressure is the pressure of blood in the arteries when the heart contracts.", "p_ent": 0.01073, "p_con": 0.00458}]}, "d2": {"node_id": 2, "p_idx": 1, "text": "A systolic blood pressure value is the pressure when the heart contracts and blood is pumped out into the arteries. A minimum systolic value can be roughly estimated by palpation, most often used in emergency situations, but should be used with caution.", "passage_title": "Blood pressure measurement", "passage": "used for routine examinations and monitoring. A minimum systolic value can be roughly estimated by palpation, most often t": 0.99761, "p_con": 0.00116}]}, "d_rouge": 24.590930341280966, "d_strem": 50.0, "d_cit": 100.0, "rank": 88, "priority": false}, {"id": "R-421", "task": "R", "set": "B", "q_idx": 421, "question": "Where does the amazon river start and finish?", "short_answers": [{"q": "Where does the Amazon river start and end?", "a": ["Mantaro River and Atlantic Ocean"]}, {"q": "Where was it commonly believed the Amazon river started and finished?", "a": ["Apurímac River on Nevado Mismi and Atlantic Ocean"]}, {"q": "Where is the source of the Amazon River?", "a": ["Río Mantaro", "Huancayo, Huancayo Province, Peru"]}, {"q": "Where is the mouth of the Amazon River?", "a": ["Atlantic Ocean", "Brazil"]}], "references": ["The Amazon River, located in South America, is the largest river by discharge volume of water in the world. It is also one of the world's longest rivers. For nearly a century, the start and end of the river was considered to be the Apurímac River on Nevado Mismi and Atlantic Ocean. However, a 2014 study identified the most distant source of the Amazon as actually being in the Río Mantaro, located in the central region of Peru. This means the Amazon River starts and ends in the Mantaro River and Atlantic Ocean, respectively. ", "The Amazon River in South America is the largest river by discharge volume of water in the world, and the disputed longest river in the world. The Amazon River starts and ends at the Mantaro River and Atlantic Ocean. The Mantaro River, or Río Mantaro, runs through Huancayo Province in Peru. It is commonly believed that the Amazon River started and finished at the Apurímac River on Nevado Mismi and Atlantic Ocean. The mouth of the Amazon River is in Brazil at the Atlantic Ocean."], "released": {"node_id": 2, "p_idx": 1, "text": "The Amazon River starts in the Andes of Peru and Colombia and finishes in the Atlantic Ocean.", "passage_title": "Amazon River", "passage": "Brazil the river is known at this point as the \"Solimões das Águas\". The river systems and flood plains in Brazil, Peru, Ecuador, Colombia and Venezuela, whose waters drain into the \"Solimões\" and its tributaries, are called the \"Upper Amazon\". The Amazon proper runs mostly through Brazil and Peru, and is part of the border between Colombia and Perú. It has a series of major tributaries in Colombia, Ecuador and Peru, some of which flow into the Marañón and Ucayali, and others directly into the Amazon proper. These include rivers Putumayo, Caquetá, Vaupés, Guainía, Morona, Pastaza, Nucuray, Urituyacu, Chambira, Tigre,", "rouge": 30.76923076923077, "str_em": 25.0, "cit_rec": 0.0, "cit_prec": 0.0, "length": 17, "issup": 0.8969867493834199, "relevance": 0.9991573577195696, "released_score": 1.8961441071029896, "g_mean": 9e-05, "sents": [{"s": "The Amazon River starts in the Andes of Peru and Colombia and finishes in the Atlantic Ocean.", "p_ent": 9e-05, "p_con": 0.00042}, {"s": "The Amazon River starts in the Andes of Peru and Colombia and finishes in the Atlantic Ocean.", "p_ent": 9e-05, "p_con": 0.00042}]}, "d2": {"node_id": 1, "p_idx": 0, "text": "The Amazon River in South America is the largest river by discharge volume of water in the world, and by some definitions it is the longest. The headwaters of the Apurímac River on Nevado Mismi had been considered for nearly a century as the Amazon's most distant source, until a 2014 study found it to be the Cordillera Rumi Cruz at the headwaters of the Mantaro River in Peru. The Mantaro and Apurímac join, and with other tributaries form the Ucayali River, which in turn meets the Marañón River upstream of Iquitos, Peru, where the Amazon River ends.", "passage_title": "Amazon River", "passage": "Amazon River The Amazon River (, ; Spanish and ) in South America is the largest river by discharge volume of water in the world, and by some definitions it is the longest. The headwaters of the Apurímac River on Nevado Mismi had been considered for nearly a century as the Amazon's most distant source, un  "claude-opus-5-5"}, "G-682-4": {"supported": "partial", "error": "issup_wrongfact", "note": "Faraday built an early alternator (supported); 'first AC system' and '1821' are not.", "by": "claude-opus-5-5"}, "G-469-1": {"supported": "partial", "error": "issup_wrongfact", "note": "'not until 1981 ... Carnes recorded her version' implies earlier recordings, so 'first recorded' is wrong.", "by": "claude-opus-5-5"}, "G-258-1": {"supported": "partial", "error": "issup_detail", "note": "Passage: November 2017; the day is not given.", "by": "claude-opus-5-5"}, "G-852-2": {"supported": "no", "error": "issup_wrongfact", "note": "Passage: Pickens moved to repeal the ordinance, not wrote it.", "by": "claude-opus-5-5"}, "G-133-2": {"supported": "no", "error": "issup_wrongfact", "note": "Passage: Montreal beat the Rangers in 1979.", "by": "claude-opus-5-5"}, "G-133-4": {"supported": "no", "error": "issup_wrongfact", "note": "Same as G-133-2.", "by": "claude-opus-5-5"}, "G-133-1": {"supported": "no", "error": "issup_wrongfact", "note": "Canadiens won the 1979 final.", "by": "claude-opus-5-5"}, "G-521-0": {"supported": "yes", "error": "deb_verbatim", "note": "Verbatim first sentence of the passage.", "by": "claude-opus-5-5"}, "G-916-0": {"supported": "yes", "error": "deb_bridge", "note": "Portsmouth Alarm (Dec 1774) and the April 1775 warning.", "by": "claude-opus-5-5"}, "G-133-0": {"supported": "partial", "error": "issup_detail", "note": "1994 win supported; 'April 13' is not (and is wrong).", "by": "claude-opus-5-5"}, "G-375-1": {"supported": "yes", "error": "deb_verbatim", "note": "Verbatim (drops 'Wednesday').", "by": "claude-opus-5-5"}, "G-843-0": {"supported": "partial", "error": "issup_wrongfact", "note": "Long Island supported; 'two children' is wrong (a daughter and twin sons).", "by": "claude-opus-5-5"}, "G-557-3": {"supported": "partial", "error": "both_ok", "note": "Panthers' home stadium supported; 'Charlotte, North Carolina' is not in the passage.", "by": "claude-opus-5-5"}};</script>
<script>
const D = window.LABEL_DATA;
const KEY = 'd2_labels_v1';
let L = {};
try { L = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { L = {}; }
for (const [k, v] of Object.entries(window.LABEL_DEFAULTS || {})) if (!L[k]) L[k] = {...v};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(L)); } catch (e) {} };

const R_REASON = [
  ['wrong_entity', '答错对象', '答的是另一个实体/事件/建筑/联赛等，不是问的那个（Blue Lagoon 威尔士之外的典型：西班牙国王、Whirlpool 星系）'],
  ['other_reading', '另一种解读', '回答了问题的另一种合理解读；可能不在参考答案覆盖范围内（备注里写 in-ref / not-in-ref）'],
  ['non_answer', '答非所问', '同一主题，但根本没回答问题（如只介绍 Premier League 是什么）'],
  ['factual_error', '事实错误', '对象对，但关键事实错（把 ALCS 对手当 World Series 对手、编造片名）'],
  ['less_coverage', '内容变少', '方向对，但覆盖的答案点/消歧更少'],
  ['rouge_false', 'ROUGE 误判', '其实答得不差，甚至更好'],
  ['d2_fixes', 'D2 更正确/更完整', 'D2 纠正了 released 的错误、偏题，或覆盖更全'],
  ['equivalent', '基本等价', '两个答案内容相同，只是措辞不同'],
  ['other', '其他', '写在备注里'],
];
const R_BETTER = [['released', 'Released 更好'], ['tie', '差不多'], ['d2', 'D2 更好']];
const R_TAGS = [['off_question', '偏题（与问题不符）'], ['shorter', '更短'], ['more_grounded', 'D2 更贴 passage'],
  ['released_halluc', 'Released 有错/幻觉'], ['d2_halluc', 'D2 有错/幻觉'], ['both_bad', '两个都差']];

const G_SUP = [['yes', '支持'], ['partial', '部分支持'], ['no', '不支持']];
const G_ERR = [
  ['deb_verbatim', 'DeBERTa 漏判：几乎原句'],
  ['deb_bridge', 'DeBERTa 漏判：跨句/改写'],
  ['deb_falsecon', 'DeBERTa 误判矛盾'],
  ['deb_falsepos', 'DeBERTa 误判为支持（常识）'],
  ['issup_detail', 'ISSUP 漏检：多余细节（日期/数字）'],
  ['issup_wrongfact', 'ISSUP 漏检：错误事实'],
  ['both_ok', '两者都有道理/边界'],
  ['other', '其他'],
];

let task = 'R', idx = 0;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d = 1) => v == null ? '–' : (+v).toFixed(d);
const sgn = v => (v > 0 ? '+' : '') + fmt(v);

function items() {
  let xs = task === 'R' ? D.swaps : D.g4;
  if (task === 'R' && document.getElementById('fPrio').checked) xs = xs.filter(x => x.priority);
  const s = document.getElementById('fSet').value;
  if (task === 'R' && s) xs = xs.filter(x => x.set === s);
  if (document.getElementById('fUndone').checked) xs = xs.filter(x => !isDone(x) || cur() === x);
  return xs;
}
let curItem = null;
const cur = () => curItem;
function isDone(x) {
  const l = L[x.id]; if (!l) return false;
  return x.task === 'R' ? !!(l.reason && l.better) : !!(l.supported && l.error);
}

// highlighting
const STOP = new Set('the a an of in on at to and or is was were be by for with as from that this it its his her their which who when where what how did does do are has had have than into after before during over about'.split(' '));
const toks = s => (String(s).toLowerCase().match(/[\p{L}\p{N}]+/gu) || []).filter(t => !STOP.has(t) && (t.length > 2 || /\d/.test(t)));
function highlight(text, words, cls = '') {
  const set = new Set(words);
  return esc(text).replace(/[\p{L}\p{N}]+/gu, w => set.has(w.toLowerCase()) ? `<mark class="${cls}">${w}</mark>` : w);
}
function hlPhrases(text, phrases) {
  let h = esc(text);
  const ps = [...new Set(phrases.filter(p => p && p.length > 1))].sort((a, b) => b.length - a.length);
  for (const p of ps) {
    const re = new RegExp('(' + esc(p).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'gi');
    h = h.replace(re, '<mark class="sa">$1</mark>');
  }
  return h;
}

function renderList() {
  const xs = items();
  const all = task === 'R' ? D.swaps.filter(x => !document.getElementById('fPrio').checked || x.priority) : D.g4;
  const done = all.filter(isDone).length;
  document.getElementById('prog').textContent = `${task === 'R' ? 'R' : 'G4'}：已标 ${done} / ${all.length}　（R 全部 ${D.swaps.filter(isDone).length}/${D.swaps.length}，G4 ${D.g4.filter(isDone).length}/${D.g4.length}）`;
  document.getElementById('pbar').style.width = (100 * done / Math.max(1, all.length)) + '%';
  document.getElementById('list').innerHTML = xs.map((x, i) => `
    <div class="item ${x === curItem ? 'cur' : ''}" data-i="${i}">
      <span class="n">${x.rank}</span>
      <span class="q" title="${esc(x.question)}">${esc(x.question)}</span>
      <span style="display:flex;gap:6px;align-items:center">
        ${task === 'R' ? `<span class="chip ${x.d_rouge < 0 ? 'down' : 'up'}">${sgn(x.d_rouge)}</span>` : `<span class="chip">${fmt(x.gap, 2)}</span>`}
        <span class="dot ${isDone(x) ? 'done' : ''}"></span></span>
    </div>`).join('');
  document.querySelectorAll('.item').forEach(el => el.onclick = () => { go(+el.dataset.i); });
  const c = document.querySelector('.item.cur'); if (c) c.scrollIntoView({block: 'nearest'});
}

function ansCard(name, a, other, sa) {
  const sents = a.sents.map(s => `<div><b style="color:${s.p_ent >= .5 ? 'var(--good)' : s.p_con >= .5 ? 'var(--bad)' : 'var(--warn)'}">ent ${fmt(s.p_ent, 2)}</b><span>${esc(s.s)}</span></div>`).join('');
  const d = (k, better = 1) => { const v = (a[k] ?? 0) - (other[k] ?? 0); return v === 0 ? '' : (v * better > 0 ? 'up' : 'down'); };
  return `<div class="card">
    <h3>${name} · passage #${a.p_idx}</h3>
    <div class="ans">${hlPhrases(a.text, sa)}</div>
    <div class="chips">
      <span class="chip ${d('rouge')}">ROUGE ${fmt(a.rouge)}</span>
      <span class="chip ${d('str_em')}">str-em ${fmt(a.str_em)}</span>
      <span class="chip ${d('cit_rec')}">cit rec ${fmt(a.cit_rec)}</span>
      <span class="chip">len ${a.length ?? '–'}</span>
      <span class="chip">ISSUP ${fmt(a.issup, 2)}</span>
      <span class="chip">g_mean ${fmt(a.g_mean, 2)}</span>
      <span class="chip">rel ${fmt(a.relevance, 2)}</span>
    </div>
    <div class="sents">${sents}</div>
    <details><summary><span class="ptitle">📄 ${esc(a.passage_title)}</span></summary>
      <div class="passage">${highlight(a.passage, toks(a.text))}</div></details>
  </div>`;
}

function saBlock(x) {
  if (!x.short_answers?.length) return '';
  return `<div class="card"><h3>消歧子问题 / short answers（绿色 = 出现在回答里）</h3><div class="sa-list">${
    x.short_answers.map(s => `<div>• ${esc(s.q)} → <b>${s.a.map(esc).join(' / ')}</b></div>`).join('')}</div></div>`;
}

function renderR(x) {
  const sa = x.short_answers.flatMap(s => s.a);
  return `<div class="meta"><span>#${x.rank} / ${D.swaps.length}</span><span>Set ${x.set}</span><span>q_idx ${x.q_idx}</span>
      <span class="chip ${x.d_rouge < 0 ? 'down' : 'up'}">ΔROUGE ${sgn(x.d_rouge)}</span>
      <span class="chip ${x.d_strem < 0 ? 'down' : x.d_strem > 0 ? 'up' : ''}">Δstr-em ${sgn(x.d_strem)}</span>
      <span class="chip ${x.d_cit < 0 ? 'down' : x.d_cit > 0 ? 'up' : ''}">Δcit ${sgn(x.d_cit)}</span></div>
    <h1>${esc(x.question)}</h1>
    ${saBlock(x)}
    <div class="cols">${ansCard('Released', x.released, x.d2, sa)}${ansCard('D2', x.d2, x.released, sa)}</div>
    <div class="card"><details><summary>参考长答案（ROUGE 对照的 ${x.references.length} 条）</summary>
      <ul class="refs">${x.references.map(r => `<li>${hlPhrases(r, sa)}</li>`).join('')}</ul></details></div>`;
}

function renderG(x) {
  const sa = x.short_answers.flatMap(s => s.a);
  return `<div class="meta"><span>#${x.rank} / ${D.g4.length}</span><span>q_idx ${x.q_idx}</span><span>p_idx ${x.p_idx}</span>
      <span class="chip">gap ${fmt(x.gap, 3)}</span></div>
    <h1>${esc(x.question)}</h1>
    <div class="card"><h3>待判断的句子（第一句）</h3><div class="ans big">${esc(x.sentence)}</div>
      <div class="chips">
        <span class="chip">ISSUP ${fmt(x.issup, 3)} ${esc(x.issup_label)}</span>
        <span class="chip ${x.p_ent >= .5 ? 'up' : 'down'}">DeBERTa ent ${fmt(x.p_ent, 3)}</span>
        <span class="chip">neu ${fmt(x.p_neu, 3)}</span>
        <span class="chip ${x.p_con >= .5 ? 'down' : ''}">con ${fmt(x.p_con, 3)}</span>
        <span class="chip ${x.t5 ? 'up' : 'down'}">T5 ${x.t5 ? '支持' : '不支持'}</span>
        <span class="chip">cand cit rec ${fmt(x.cit_rec)}</span>
      </div>
      <div class="hint">黄色 = 句子中的词在 passage 里出现；先自己判断，再看分数。</div></div>
    <div class="card"><h3>Passage</h3><div class="passage" style="max-height:none;font-size:14px">${highlight(x.passage, toks(x.sentence))}</div></div>
    ${saBlock(x)}`;
}

function optRow(label, opts, field, keys, multi = false) {
  const l = L[curItem.id] || {};
  return `<div class="row"><span class="lab">${label}</span>${opts.map((o, i) => {
    const on = multi ? (l[field] || []).includes(o[0]) : l[field] === o[0];
    return `<button class="opt ${on ? 'on' : ''}" data-f="${field}" data-v="${o[0]}" data-m="${multi ? 1 : ''}" title="${esc(o[2] || '')}">${keys ? `<kbd>${keys[i] ?? ''}</kbd>` : ''}${o[1]}</button>`;
  }).join('')}</div>`;
}

function renderBar() {
  const x = curItem; if (!x) { document.getElementById('lbar').innerHTML = ''; return; }
  const l = L[x.id] || {};
  let h = l.by ? `<div class="hint">标注来源：${esc(l.by)}${l.reviewed ? '（已人工复核）' : '（未复核，改动任意一项即视为已复核）'}</div>` : '';
  if (x.task === 'R') {
    h += optRow('主要原因', R_REASON, 'reason', ['1', '2', '3', '4', '5', '6', '7', '8', '9']);
    h += optRow('哪个更好', R_BETTER, 'better', ['Q', 'W', 'E']);
    h += optRow('附加标签', R_TAGS, 'tags', ['A', 'S', 'D', 'F', 'G', 'H'], true);
  } else {
    h += optRow('人工：支持?', G_SUP, 'supported', ['Q', 'W', 'E']);
    h += optRow('错误类型', G_ERR, 'error', ['1', '2', '3', '4', '5', '6', '7', '8']);
  }
  h += `<div class="row"><span class="lab">备注</span><textarea id="note" placeholder="可选（按 / 聚焦，Esc 退出）">${esc(l.note || '')}</textarea>
    <button id="prev">← 上一条</button><button id="next">下一条 →</button><button id="nextU">下一条未标 ⏎</button></div>
    <div class="hint">快捷键：数字/字母选择 · ←/→ 或 J/K 翻页 · Enter 跳到下一条未标 · 鼠标悬停原因按钮可看定义 · 自动保存在本浏览器</div>`;
  document.getElementById('lbar').innerHTML = h;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => setVal(b.dataset.f, b.dataset.v, !!b.dataset.m));
  const n = document.getElementById('note');
  n.oninput = () => { (L[x.id] ||= {}).note = n.value; stamp(); save(); };
  document.getElementById('prev').onclick = () => step(-1);
  document.getElementById('next').onclick = () => step(1);
  document.getElementById('nextU').onclick = nextUndone;
}
function stamp() { L[curItem.id].t = new Date().toISOString(); if (L[curItem.id].by) L[curItem.id].reviewed = true; }
function setVal(f, v, multi) {
  const l = (L[curItem.id] ||= {});
  if (multi) { const s = new Set(l[f] || []); s.has(v) ? s.delete(v) : s.add(v); l[f] = [...s]; }
  else l[f] = l[f] === v ? undefined : v;
  stamp(); save(); renderBar(); renderList();
}

function go(i) {
  const xs = items(); if (!xs.length) { curItem = null; document.getElementById('view').innerHTML = '<p>没有符合筛选的条目。</p>'; renderBar(); renderList(); return; }
  idx = Math.max(0, Math.min(xs.length - 1, i)); curItem = xs[idx];
  document.getElementById('view').innerHTML = curItem.task === 'R' ? renderR(curItem) : renderG(curItem);
  document.getElementById('main').scrollTop = 0;
  renderBar(); renderList();
  try { localStorage.setItem(KEY + '_pos', JSON.stringify({task, id: curItem.id})); } catch (e) {}
}
function step(d) { const xs = items(); const i = xs.indexOf(curItem); go((i < 0 ? 0 : i) + d); }
function nextUndone() {
  const xs = items(); const i = xs.indexOf(curItem);
  for (let k = 1; k <= xs.length; k++) { const y = xs[(i + k) % xs.length]; if (!isDone(y)) { go(xs.indexOf(y)); return; } }
}
function setTask(t) {
  task = t; document.getElementById('tR').classList.toggle('on', t === 'R'); document.getElementById('tG').classList.toggle('on', t === 'G');
  document.getElementById('fPrioL').style.display = document.getElementById('fSetL').style.display = t === 'R' ? '' : 'none';
  curItem = null; go(0);
}
document.getElementById('tR').onclick = () => setTask('R');
document.getElementById('tG').onclick = () => setTask('G');
['fPrio', 'fUndone', 'fSet'].forEach(id => document.getElementById(id).onchange = () => { const c = curItem; const xs = items(); go(Math.max(0, xs.indexOf(c))); });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.target.tagName === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey || !curItem) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright' || k === 'j') return step(1);
  if (k === 'arrowleft' || k === 'k') return step(-1);
  if (k === 'enter') { e.preventDefault(); return nextUndone(); }
  if (k === '/') { e.preventDefault(); return document.getElementById('note').focus(); }
  const R = curItem.task === 'R';
  const num = '123456789'.indexOf(k), qwe = 'qwe'.indexOf(k), asd = 'asdfgh'.indexOf(k);
  if (num >= 0) { const o = R ? R_REASON : G_ERR; if (o[num]) setVal(R ? 'reason' : 'error', o[num][0]); }
  else if (qwe >= 0) { const o = R ? R_BETTER : G_SUP; setVal(R ? 'better' : 'supported', o[qwe][0]); }
  else if (asd >= 0 && R) setVal('tags', R_TAGS[asd][0], true);
});

// export / import
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], {type})); a.download = name; a.click();
}
const csvCell = v => { v = Array.isArray(v) ? v.join(';') : (v ?? ''); v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCsv = rows => rows.map(r => r.map(csvCell).join(',')).join('\n');
const lab = (opts, v) => (opts.find(o => o[0] === v) || [])[1] || '';
document.getElementById('exCsv').onclick = () => {
  const r = [['id', 'set', 'q_idx', 'rank', 'priority', 'question', 'd_rouge', 'd_strem', 'd_cit', 'released_p_idx', 'd2_p_idx', 'reason', 'reason_zh', 'better', 'tags', 'note', 'by', 'reviewed']];
  D.swaps.forEach(x => { const l = L[x.id] || {}; r.push([x.id, x.set, x.q_idx, x.rank, x.priority ? 1 : 0, x.question, x.d_rouge.toFixed(2), x.d_strem.toFixed(2), x.d_cit.toFixed(2), x.released.p_idx, x.d2.p_idx, l.reason, lab(R_REASON, l.reason), l.better, l.tags, l.note, l.by, l.reviewed ? 1 : 0]); });
  download('label_rouge_swaps_AB.csv', toCsv(r), 'text/csv');
  const g = [['q_idx', 'p_idx', 'gap', 'issup_score', 'deberta_p_ent', 'deberta_p_con', 't5_verdict', 'question', 'sentence', 'human_supported', 'error_type', 'error_type_zh', 'note', 'by', 'reviewed']];
  D.g4.forEach(x => { const l = L[x.id] || {}; g.push([x.q_idx, x.p_idx, x.gap, x.issup, x.p_ent, x.p_con, x.t5, x.question, x.sentence, l.supported, l.error, lab(G_ERR, l.error), l.note, l.by, l.reviewed ? 1 : 0]); });
  setTimeout(() => download('ground_diag_A_G4_labeled.csv', toCsv(g), 'text/csv'), 300);
};
document.getElementById('exJson').onclick = () => download('d2_labels.json', JSON.stringify({version: 1, exported: new Date().toISOString(), labels: L}, null, 1), 'application/json');
document.getElementById('imJson').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse((await f.text()).replace(/^﻿/, ''));
    const inc = j.labels || j; let n = 0;
    for (const [k, v] of Object.entries(inc)) { if (!L[k] || (v.t || '') >= (L[k].t || '')) { L[k] = v; n++; } }
    save(); go(idx); alert(`导入 ${n} 条（同一条取较新的）`);
  } catch (err) { alert('导入失败：' + err.message); }
};

// restore position
let pos = null; try { pos = JSON.parse(localStorage.getItem(KEY + '_pos') || 'null'); } catch (e) {}
setTask(pos?.task || 'R');
if (pos) { const xs = items(); const i = xs.findIndex(x => x.id === pos.id); if (i >= 0) go(i); }
</script>
